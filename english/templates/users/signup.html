{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "Sign up" %}{% endblock %}
{% block content %}
<h1>{% translate "Sign up" %}</h1>
<form method="post" class="card">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">{% translate "Create account" %}</button>
</form>
{% endblock %}
