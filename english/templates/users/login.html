{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "Login" %}{% endblock %}
{% block content %}
<h1>{% translate "Login" %}</h1>
<form method="post" class="card">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">{% translate "Log in" %}</button>
</form>
{% endblock %}
